name: Wheels

on:
  workflow_dispatch:
  push:
    branches:
     - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v6
      with:
        name: sdist
        path: dist/*.tar.gz


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15-intel   # x86_64
          - macos-14         # arm64

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
  
    - name: Create vcpkg binary cache directory
      shell: bash
      run: mkdir -p "${{ runner.temp }}/vcpkg-cache"

    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-wheels-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'triplets/**') }}
        restore-keys: vcpkg-wheels-${{ matrix.os }}-

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ runner.temp }}/vcpkg
        vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
        binaryCachePath: ${{ runner.temp }}/vcpkg-cache

    - uses: pypa/cibuildwheel@v4.3
      env:
        # Linux only: expose host vcpkg and its cache inside the manylinux container
        CIBW_CONTAINER_ENGINE: >-
          docker; create_args:
          -v ${{ runner.temp }}/vcpkg:${{ runner.temp }}/vcpkg
          -v ${{ runner.temp }}/vcpkg-cache:${{ runner.temp }}/vcpkg-cache
        CIBW_ENVIRONMENT_PASS_LINUX: VCPKG_ROOT VCPKG_BINARY_SOURCES VCPKG_DEFAULT_BINARY_CACHE
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache

    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v6
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl


  upload_all:
    name: Upload if release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      id-token: write   # only needed for trusted publishing, see notes

    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: "{sdist,wheels-*}"
        merge-multiple: true
        path: dist

    - uses: pypa/gh-action-pypi-publish@release/v1

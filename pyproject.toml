[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"


[project]
name = "py3dti"
version = "0.3.0"
description="Python bindings for the 3dti Audio Spatialiser."
readme = "README.md"
authors = [
  { name = "Johan Pauwels", email = "johan.pauwels@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]


[tool.scikit-build]
sdist.exclude = ["docs", "resources", "3dti_AudioToolkit/3dti_ResourceManager/third_party_libraries/sofacoustics/libsofa/lib"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]


[tool.cibuildwheel]
build-verbosity = 1
skip = "*musllinux*"
test-command = "pytest {project}/tests"
test-extras = ["test"]

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]
before-all = [
  "yum install -y zip unzip curl tar perl-IPC-Cmd pkgconfig",
  "\"$VCPKG_ROOT/bootstrap-vcpkg.sh\" -disableMetrics",
]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
